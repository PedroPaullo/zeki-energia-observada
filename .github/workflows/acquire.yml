name: Acquire official ANEEL source
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 12 * *'
  push:
    paths: ['scripts/acquire_source.py', '.github/workflows/acquire.yml']
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/acquire_source.py
      - run: python -m pip install -e .
      - name: Validate and publish complete real pipeline
        run: |
          python -m energia_observada ingest --year 2026 --file acquired/official2026.parquet --metadata acquired/acquisition.json
          python -m energia_observada transform
          python -m energia_observada ingest --year 2026 --file acquired/official2026.parquet --metadata acquired/acquisition.json
          python -m energia_observada transform
          python -m energia_observada status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-aneel-2026
          path: |
            acquired/
            data/active.json
            data/last_attempt.json
            data/models/*/manifest.json
            data/models/*/monthly.parquet
          compression-level: 0
          retention-days: 7
